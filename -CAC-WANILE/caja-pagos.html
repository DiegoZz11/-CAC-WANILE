<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="/Utilities/investigacion.png" type="Icon-Banco" />
    <title>Caja de Pagos</title>
    <style>
        .buscador {
            display: flex;
            gap: 1rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
            align-items: center;
        }
        .buscador input {
            flex: 1;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-width: 200px;
        }
        .buscador button {
            padding: 0.6rem 1.5rem;
            background: #0066b3;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .buscador button:hover { background: #004d8c; }
        .info-socio {
            background: #fff;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
        }
        .tabla-cuotas {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .tabla-cuotas th {
            background: #f0f4f8;
            padding: 0.8rem 1rem;
            text-align: left;
        }
        .tabla-cuotas td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #e9edf2;
        }
        .tabla-cuotas tr:hover td { background: #f8faff; }
        .btn-pagar {
            background: #28a745;
            color: #fff;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-pagar:hover { background: #1e7e34; }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-contenido {
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .modal-contenido h3 { margin-top: 0; }
        .modal-contenido p { margin: 0.5rem 0; }
        .modal-contenido .total {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0066b3;
        }
        .modal-botones {
            margin-top: 1.5rem;
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
        }
        .modal-botones button {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-cancelar { background: #e9ecef; }
        .btn-confirmar { background: #28a745; color: #fff; }
        .btn-confirmar:hover { background: #1e7e34; }
        .volver {
            display: inline-block;
            margin: 1.5rem 0;
            color: #0066b3;
            text-decoration: none;
        }
        .volver:hover { text-decoration: underline; }
        .sin-resultados {
            text-align: center;
            padding: 2rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="content">
        <h1>Caja de Pagos</h1>
        <p>Registre pagos de cuotas de créditos.</p>

        <div class="buscador">
            <input type="text" id="buscarSocio" placeholder="Buscar por cédula o nombre" />
            <button id="btnBuscar">Buscar</button>
        </div>

        <div id="infoSocio" class="info-socio" style="display:none;">
            <!-- Se llena con JS -->
        </div>

        <div id="cuotasContainer">
            <table class="tabla-cuotas" id="tablaCuotas">
                <thead>
                    <tr>
                        <th>Crédito ID</th>
                        <th>Cuota</th>
                        <th>Vencimiento</th>
                        <th>Capital</th>
                        <th>Interés</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpoCuotas">
                    <tr><td colspan="8" class="sin-resultados">Busque un socio para ver sus cuotas pendientes.</td></tr>
                </tbody>
            </table>
        </div>

        <a href="dashboard.html" class="volver">← Volver al Dashboard</a>
    </div>
</div>

<!-- Modal para confirmar pago -->
<div id="modalPago" class="modal">
    <div class="modal-contenido">
        <h3>Confirmar Pago</h3>
        <input type="hidden" id="planPagoId" />
        <p><strong>Cuota:</strong> <span id="cuotaNumero"></span></p>
        <p><strong>Monto total adeudado:</strong> <span id="montoTotal"></span></p>
        <p><strong>Mora calculada:</strong> <span id="montoMora">Lps 0.00</span></p>
        <p class="total">Total a pagar: <span id="totalPagar">Lps 0.00</span></p>
        <div style="margin: 1rem 0;">
            <label>Fecha de pago (si es diferente a hoy):</label>
            <input type="date" id="fechaPago" class="form-control" style="width:100%;padding:0.5rem;border:1px solid #ccc;border-radius:6px;" />
        </div>
        <div class="modal-botones">
            <button class="btn-cancelar" id="btnCancelarPago">Cancelar</button>
            <button class="btn-confirmar" id="btnConfirmarPago">Pagar</button>
        </div>
    </div>
</div>

<script src="caja-pagos.js"></script>
</body>
</html>
